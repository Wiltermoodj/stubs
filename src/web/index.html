<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Stubs Spec Manager (PWA)</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1e1e2e" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: oklch(0.15 0.02 240);
        color: oklch(0.85 0.02 240);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        overflow-x: hidden;
        /* Prevent elastic bounce on iOS devices */
        position: fixed;
        width: 100%;
        height: 100%;
      }

      #app-container {
        width: 100%;
        height: 100%;
      }

      /* Scrollbar auto-hide (ADR 0044): overlay, hidden at rest, visible on active scroll */
      .custom-scroll {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        transition: scrollbar-color 150ms ease-in;
      }
      .custom-scroll.is-scrolling {
        scrollbar-color: oklch(0.32 0.02 240) transparent;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 5px;
        height: 5px;
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 4px;
        transition: background 150ms ease-in;
      }
      .custom-scroll.is-scrolling::-webkit-scrollbar-thumb {
        background: oklch(0.32 0.02 240);
      }

      /* Drawer transitions (Emphasis tier: 300ms, ease-out for entering) */
      .drawer {
        transition: transform 300ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer {
          transition: none;
        }
      }

      /* Touch specific improvements */
      .touch-action-none {
        touch-action: none;
      }

      /* Node selection highlight */
      .node-focus {
        stroke: oklch(0.6 0.25 250);
        stroke-width: 3.5px;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="app-container" class="flex flex-col h-full w-full"></div>

    <!-- Load bundled web build entry point -->
    <script src="app.js"></script>

    <script>
      // Scrollbar auto-hide: add is-scrolling class during scroll, remove after 300ms idle
      (function () {
        function initScrollbarAutoHide(el) {
          let timer;
          el.addEventListener('scroll', function () {
            el.classList.add('is-scrolling');
            clearTimeout(timer);
            timer = setTimeout(function () {
              el.classList.remove('is-scrolling');
            }, 300);
          }, { passive: true });
        }
        // Observe dynamically added custom-scroll elements
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (node.nodeType !== 1) return;
              if (node.classList && node.classList.contains('custom-scroll')) initScrollbarAutoHide(node);
              node.querySelectorAll && node.querySelectorAll('.custom-scroll').forEach(initScrollbarAutoHide);
            });
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <script>
      // Bridge beforeinstallprompt into the app shell for the install banner
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__pwaBeforeInstallPrompt = event;
        if (typeof setupPwaInstallBanner === 'function') {
          setupPwaInstallBanner();
        }
      });

      // Register Service Worker for Progressive Web App (PWA) offline usage
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('sw.js')
            .then((reg) => console.log('ServiceWorker registered successfully:', reg.scope))
            .catch((err) => console.warn('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
